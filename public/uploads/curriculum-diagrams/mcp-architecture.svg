>
  <defs>
    <!-- Arrow Marker -->
    <marker 
      id="arrow-ai-architecture" 
      viewBox="0 0 10 10" 
      refX="8" 
      refY="5" 
      markerWidth="6" 
      markerHeight="6" 
      orient="auto-start-reverse"
    >
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>

    <!-- Node Drop Shadow Filter -->
    <filter id="shadow-node" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <filter id="shadow-subtle" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <!-- Canvas Grid Pattern -->
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D1FAE5" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1535" height="700" fill="#FAFAF9" rx="16"/>
