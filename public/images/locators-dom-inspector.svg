<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="domBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#181B26"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" rx="16" fill="url(#domBg)"/>
  <rect width="998" height="498" x="1" y="1" rx="15" fill="none" stroke="#2B2F42" stroke-width="2"/>

  <!-- Chrome DevTools Top Bar -->
  <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 984 0 C 992.84 0 1000 7.16 1000 16 L 1000 44 L 0 44 Z" fill="#202330"/>
  <circle cx="24" cy="22" r="6" fill="#EF4444"/>
  <circle cx="44" cy="22" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="22" r="6" fill="#10B981"/>

  <text x="100" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#9CA3AF">Elements</text>
  <text x="170" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Console</text>
  <text x="235" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Sources</text>
  <text x="300" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#6B7280">Network</text>

  <!-- Left: DOM Tree -->
  <g transform="translate(24, 64)">
    <rect width="560" height="400" rx="10" fill="#13151F" stroke="#262A3B" stroke-width="1"/>
    <text x="20" y="32" font-family="monospace" font-size="13" fill="#60A5FA">&lt;html lang="en"&gt;</text>
    <text x="36" y="58" font-family="monospace" font-size="13" fill="#60A5FA">&lt;body class="qa-app"&gt;</text>
    <text x="52" y="84" font-family="monospace" font-size="13" fill="#60A5FA">&lt;header class="nav-bar"&gt;...&lt;/header&gt;</text>
    <text x="52" y="110" font-family="monospace" font-size="13" fill="#60A5FA">&lt;main id="content"&gt;</text>

    <!-- Highlighted Active Target Element -->
    <rect x="64" y="128" width="480" height="56" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="76" y="150" font-family="monospace" font-size="12" font-weight="700" fill="#38BDF8">
      &lt;button id="submit-btn" data-testid="login-submit"
    </text>
    <text x="88" y="172" font-family="monospace" font-size="12" font-weight="700" fill="#38BDF8">
      class="btn-primary"&gt;Submit Form&lt;/button&gt;
    </text>

    <text x="52" y="210" font-family="monospace" font-size="13" fill="#60A5FA">&lt;/main&gt;</text>
    <text x="36" y="236" font-family="monospace" font-size="13" fill="#60A5FA">&lt;/body&gt;</text>
    <text x="20" y="262" font-family="monospace" font-size="13" fill="#60A5FA">&lt;/html&gt;</text>

    <!-- Inspector Badge -->
    <rect x="20" y="320" width="520" height="60" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
    <text x="36" y="344" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#A5B4FC">
      🎯 Chrome DevTools Inspector Selection:
    </text>
    <text x="36" y="366" font-family="monospace" font-size="11" fill="#C7D2FE">
      button#submit-btn.btn-primary | 120 x 40 px | Visible &amp; Actionable
    </text>
  </g>

  <!-- Right: Evaluated Locator Strategies -->
  <g transform="translate(604, 64)">
    <rect width="372" height="400" rx="10" fill="#13151F" stroke="#262A3B" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#F3F4F6">
      Recommended Selenium Locators
    </text>

    <!-- Strategy 1: Data Test ID (Best Practice) -->
    <g transform="translate(16, 52)">
      <rect width="340" height="74" rx="8" fill="#064E3B" stroke="#059669" stroke-width="1"/>
      <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#34D399">
        BEST PRACTICE • RESILIENT LOCATOR
      </text>
      <text x="14" y="44" font-family="monospace" font-size="11" fill="#FFFFFF">
        By.cssSelector("[data-testid='login-submit']")
      </text>
      <text x="14" y="62" font-family="-apple-system, sans-serif" font-size="10" fill="#A7F3D0">
        Resistant to UI styling, framework and layout changes
      </text>
    </g>

    <!-- Strategy 2: ID Locator -->
    <g transform="translate(16, 138)">
      <rect width="340" height="74" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">
        HIGH PERFORMANCE • UNIQUE ID
      </text>
      <text x="14" y="44" font-family="monospace" font-size="11" fill="#FFFFFF">
        By.id("submit-btn")
      </text>
      <text x="14" y="62" font-family="-apple-system, sans-serif" font-size="10" fill="#CBD5E1">
        Direct document.getElementById lookup
      </text>
    </g>

    <!-- Strategy 3: Dynamic Relative XPath -->
    <g transform="translate(16, 224)">
      <rect width="340" height="74" rx="8" fill="#312E81" stroke="#4F46E5" stroke-width="1"/>
      <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#A5B4FC">
        ROBUST XPATH AXES
      </text>
      <text x="14" y="44" font-family="monospace" font-size="11" fill="#FFFFFF">
        By.xpath("//button[text()='Submit Form']")
      </text>
      <text x="14" y="62" font-family="-apple-system, sans-serif" font-size="10" fill="#C7D2FE">
        Matches accessible text displayed to the end-user
      </text>
    </g>

    <!-- Strategy 4: Selenium 4 Relative Locator -->
    <g transform="translate(16, 310)">
      <rect width="340" height="74" rx="8" fill="#78350F" stroke="#D97706" stroke-width="1"/>
      <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FBBF24">
        SELENIUM 4 FRIENDLY LOCATOR
      </text>
      <text x="14" y="44" font-family="monospace" font-size="10.5" fill="#FFFFFF">
        with(By.tagName("button")).below(By.id("pwd"))
      </text>
      <text x="14" y="62" font-family="-apple-system, sans-serif" font-size="10" fill="#FDE68A">
        Visual proximity calculation via element bounds
      </text>
    </g>
  </g>
</svg>