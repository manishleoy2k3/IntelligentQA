<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#14151f"/>
    </linearGradient>
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="tier4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="640" rx="24" fill="url(#bgGrad)"/>
  <rect width="1198" height="638" x="1" y="1" rx="23" fill="none" stroke="#262738" stroke-width="2"/>

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="150" y1="0" x2="150" y2="640"/>
    <line x1="300" y1="0" x2="300" y2="640"/>
    <line x1="450" y1="0" x2="450" y2="640"/>
    <line x1="600" y1="0" x2="600" y2="640"/>
    <line x1="750" y1="0" x2="750" y2="640"/>
    <line x1="900" y1="0" x2="900" y2="640"/>
    <line x1="1050" y1="0" x2="1050" y2="640"/>
  </g>

  <!-- Header Banner -->
  <text x="600" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">
    SELENIUM WEBDRIVER 4 ARCHITECTURE &amp; EXECUTION FLOW
  </text>
  <text x="600" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#9CA3AF">
    W3C Standard Protocol Communication Across Distributed Test Automation Tiers
  </text>

  <!-- Flow Arrows connecting the 4 Tiers -->
  <g stroke="#4B5563" stroke-width="3" stroke-dasharray="6,6" fill="none">
    <path d="M 270 310 L 330 310"/>
    <path d="M 570 310 L 630 310"/>
    <path d="M 870 310 L 930 310"/>
  </g>
  <g fill="#8B5CF6">
    <polygon points="325,304 337,310 325,316"/>
    <polygon points="625,304 637,310 625,316"/>
    <polygon points="925,304 937,310 925,316"/>
  </g>

  <!-- TIER 1: Java Client Bindings -->
  <g transform="translate(50, 150)">
    <rect width="220" height="320" rx="16" fill="#181924" stroke="#2D2F45" stroke-width="2"/>
    <rect width="220" height="48" rx="16" fill="url(#tier1Grad)"/>
    <text x="110" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      TIER 1 • CLIENT
    </text>
    <text x="110" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#DDD6FE">
      Java Test Scripts
    </text>
    <rect x="20" y="105" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="127" text-anchor="middle" font-family="monospace" font-size="12" fill="#A78BFA">WebDriver driver</text>
    <rect x="20" y="150" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="172" text-anchor="middle" font-family="monospace" font-size="12" fill="#A78BFA">By.xpath(...) / By.id</text>
    <rect x="20" y="195" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="217" text-anchor="middle" font-family="monospace" font-size="12" fill="#A78BFA">TestNG / JUnit 5</text>
    <rect x="20" y="240" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="262" text-anchor="middle" font-family="monospace" font-size="12" fill="#A78BFA">Page Object Model</text>
    <text x="110" y="300" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF">
      JSON Payload Serializer
    </text>
  </g>

  <!-- TIER 2: W3C Protocol -->
  <g transform="translate(340, 150)">
    <rect width="220" height="320" rx="16" fill="#181924" stroke="#2D2F45" stroke-width="2"/>
    <rect width="220" height="48" rx="16" fill="url(#tier2Grad)"/>
    <text x="110" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      TIER 2 • PROTOCOL
    </text>
    <text x="110" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#BAE6FD">
      W3C WebDriver
    </text>
    <rect x="20" y="105" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="127" text-anchor="middle" font-family="monospace" font-size="11" fill="#60A5FA">POST /session/{id}/url</text>
    <rect x="20" y="150" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#60A5FA">POST /element/{id}/click</text>
    <rect x="20" y="195" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="217" text-anchor="middle" font-family="monospace" font-size="11" fill="#60A5FA">GET /screenshot</text>
    <rect x="20" y="240" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="262" text-anchor="middle" font-family="monospace" font-size="11" fill="#60A5FA">CDP WebSocket Stream</text>
    <text x="110" y="300" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF">
      Direct REST Standard
    </text>
  </g>

  <!-- TIER 3: Browser Drivers -->
  <g transform="translate(640, 150)">
    <rect width="220" height="320" rx="16" fill="#181924" stroke="#2D2F45" stroke-width="2"/>
    <rect width="220" height="48" rx="16" fill="url(#tier3Grad)"/>
    <text x="110" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      TIER 3 • DRIVERS
    </text>
    <text x="110" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#A7F3D0">
      Browser Drivers
    </text>
    <rect x="20" y="105" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="127" text-anchor="middle" font-family="monospace" font-size="12" fill="#34D399">ChromeDriver (v131)</text>
    <rect x="20" y="150" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="172" text-anchor="middle" font-family="monospace" font-size="12" fill="#34D399">GeckoDriver (Firefox)</text>
    <rect x="20" y="195" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="217" text-anchor="middle" font-family="monospace" font-size="12" fill="#34D399">msedgedriver.exe</text>
    <rect x="20" y="240" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="110" y="262" text-anchor="middle" font-family="monospace" font-size="12" fill="#34D399">Selenium Manager (Auto)</text>
    <text x="110" y="300" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF">
      Lightweight HTTP Servers
    </text>
  </g>

  <!-- TIER 4: Real Browsers -->
  <g transform="translate(940, 150)">
    <rect width="210" height="320" rx="16" fill="#181924" stroke="#2D2F45" stroke-width="2"/>
    <rect width="210" height="48" rx="16" fill="url(#tier4Grad)"/>
    <text x="105" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      TIER 4 • TARGET
    </text>
    <text x="105" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FDE68A">
      Live Browsers
    </text>
    <rect x="15" y="105" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="105" y="127" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FBBF24">Google Chrome</text>
    <rect x="15" y="150" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="105" y="172" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FBBF24">Mozilla Firefox</text>
    <rect x="15" y="195" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="105" y="217" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FBBF24">Microsoft Edge</text>
    <rect x="15" y="240" width="180" height="34" rx="8" fill="#202232" stroke="#363852" stroke-width="1"/>
    <text x="105" y="262" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#FBBF24">Apple Safari / WebKit</text>
    <text x="105" y="300" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#9CA3AF">
      DOM Tree &amp; JavaScript
    </text>
  </g>

  <!-- Bottom Legend / Status Bar -->
  <g transform="translate(50, 510)">
    <rect width="1100" height="90" rx="12" fill="#12131A" stroke="#252736" stroke-width="1"/>
    <circle cx="40" cy="45" r="8" fill="#10B981" filter="url(#glow)"/>
    <text x="65" y="40" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      W3C Specification Compliant: Zero Translation Overhead in Selenium 4
    </text>
    <text x="65" y="62" font-family="-apple-system, sans-serif" font-size="12" fill="#9CA3AF">
      Commands are sent directly over bi-directional HTTP and WebSocket channels without legacy JSON Wire Protocol encoding wrappers.
    </text>
    <text x="1050" y="52" text-anchor="end" font-family="monospace" font-size="12" font-weight="700" fill="#A78BFA">
      IntelligentQA Architecture Labs
    </text>
  </g>
</svg>